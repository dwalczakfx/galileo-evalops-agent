[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "galileo-evalops-agent"
version = "0.4.0"
description = "A cost-bounded, Galileo-instrumented EvalOps operator."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "agent-control-sdk[galileo]>=8.4.0,<9",
  "galileo[openai]>=2.5.1,<3",
  "httpx>=0.28.1,<1",
  "openai>=2.47.0,<3",
  "python-dotenv>=1.2.2,<2",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.scripts]
evalops = "evalops_agent.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
